services:
  - type: web
    name: leash
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYPAL_MODE
        value: mock
      - key: DATABASE_PATH
        value: /tmp/leash.db
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        sync: false
      - key: AGENT_NAIVE
        value: "true"
      - key: MANDATE_SIGNING_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
